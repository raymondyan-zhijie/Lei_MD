# GitHub Actions build workflow for Lei_MD Windows executable.
#
# Companion to test.yml: runs on tag push (v*) and manual dispatch.
# Produces a PyInstaller-built Windows .exe via scripts/build-windows.ps1
# and uploads it as a workflow artifact (downloadable from the run page)
# AND attaches it to the matching GitHub Release.
#
# NSIS installer is opt-in via workflow_dispatch input because it
# requires makensis.exe on the runner (preinstalled via chocolatey
# only on a self-hosted image, not on windows-latest by default).
#
# Schedule runs a dry-run weekly to catch spec/dependency rot without
# burning a full build minute budget.

name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      with_installer:
        description: "Also build NSIS installer (requires makensis on PATH)"
        type: boolean
        required: false
        # v0.4.8: default true. Users coming to the Release page
        # expect a Setup.exe they can install (Program Files + Start
        # menu + uninstaller), not a portable green exe. The earlier
        # default false was a "be conservative with build minutes"
        # call; the NSIS step adds ~1-2 min and produces the
        # installer most users actually want.
        default: true
  schedule:
    # Sunday 02:00 UTC dry-run (verifies spec/dependencies still build)
    - cron: "0 2 * * 0"

# Don't cancel in-progress build runs — the artifact + release
# upload is non-idempotent; a cancelled mid-upload leaves a half-attached
# exe on the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # needed for release upload

jobs:
  build-windows:
    name: build-windows · py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]  # PyInstaller + PySide6 6.7-6.10 stable line
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NSIS (tag push default + manual opt-in)
        # v0.4.8: BUG FIX — previous if checked only workflow_dispatch,
        # so tag push always skipped NSIS even when default was true.
        # Now: tag push → always install NSIS (default true), OR manual
        # dispatch AND user opted in.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.with_installer)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco modifies HKLM\...\Environment\Path, but the current
          # pwsh process is already loaded with the OLD Path. Re-read
          # from the registry (the only reliable way inside one shell
          # session) so that makensis.exe is on PATH for subsequent steps.
          $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath    = [System.Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path    = "$machinePath;$userPath"
          # NSIS installs to 'C:\Program Files (x86)\NSIS\' (32-bit Program Files
          # because makensis is 32-bit); append explicitly as a belt-and-braces.
          $nsisPath    = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsisPath) { $env:Path = "$nsisPath;$env:Path" }
          makensis /VERSION

      - name: Run build-windows.ps1
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # v0.4.8: BUG FIX — was checking 'workflow_dispatch' only.
          # Now: tag push → always build installer, OR manual dispatch
          # AND user opted in.
          $withInstaller = $env:GITHUB_EVENT_NAME -eq 'push' -or $env:WITH_INSTALLER -eq 'true'
          $args = @{}
          if ($withInstaller) { $args['WithInstaller'] = $true }
          & pwsh ./scripts/build-windows.ps1 @args
        env:
          WITH_INSTALLER: ${{ github.event.inputs.with_installer }}

      - name: List dist/ contents
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lei-md-windows-${{ matrix.python-version }}
          path: |
            dist/*.exe
            installer/*.exe
          if-no-files-found: error
          retention-days: 14
      
      - name: Ensure GitHub Release exists (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag push alone does NOT create a release — `gh release upload`
          # would fail with "release not found" if we don't create it first.
          # Use `gh release view` as a pre-check so this step is fully idempotent
          # against releases created manually via the GitHub API.
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --json name 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — skipping create"
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag `
              --title "Lei_MD $tag" `
              --generate-notes `
              --draft=false
          }
          
      - name: Upload .exe to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem -Path installer -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          foreach ($f in $files) {
            Write-Host "Uploading $f to release $tag"
            gh release upload $tag $f --clobber
          }
