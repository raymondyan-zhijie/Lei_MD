# GitHub Actions CI workflow for Lei_MD
#
# Replaces v0.3.0-era manual `source .venv/bin/activate && pytest` flow.
# Triggered on push to main, PRs targeting main, and weekly schedule (Mondays).
# Matrix covers all Python versions we ship classifiers for, on both
# Windows (primary target) and Ubuntu (fast Linux smoke).
#
# MarkItDown ships a heavy dependency set, so each job installs to a
# fresh venv to avoid contamination. Caches pip wheels across runs.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 09:00 UTC — catches upstream MarkItDown releases
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Cancel in-progress runs for the same ref on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Python 3.10 EOL is 2026-10 — still supported, skip oldest Windows
          # to keep matrix at 8 (4 py × 2 os) instead of 8/9/4
          - os: windows-latest
            python-version: "3.10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 \
            libgl1 libegl1 libxcb-xinerama0
        # Qt6 needs these system libs on headless Linux runners
      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify import surface
        run: |
          python -c "import src; from src.core import converter, batch_worker, history, config, errors; from src.ui import main_window, drop_area; print('imports OK')"

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/
        continue-on-error: false

      - name: Run tests
        env:
          # Qt headless for Linux runners (Windows has a real display)
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: |
          python -m pytest --tb=short -q

      - name: Upload coverage (Ubuntu only, to save CI minutes)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -m pytest --cov=src --cov-report=xml -q
        continue-on-error: true  # Don't fail CI on cov tooling issues

      - name: Upload coverage artifact
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
