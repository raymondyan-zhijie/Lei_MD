[project]
name = "lei-md"
version = "0.4.0"
description = "Windows GUI for Microsoft MarkItDown - convert files to Markdown with drag & drop, offline and all-in-one"
authors = [{name = "leimengde"}]
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "markitdown[all]>=0.1.0,<0.2.0",
    "PySide6>=6.7,<7.0",
    "darkdetect>=0.8,<0.9",
    "markdown>=3.6,<4.0",
    "Pygments>=2.18,<3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0,<5.0",
    "ruff>=0.5,<0.10",
    "packaging>=24.0",  # for upstream version check
]

[project.scripts]
lei-md = "src.main:main"

[project.urls]
Homepage = "https://github.com/raymondyan-zhijie/Lei_MD"
Repository = "https://github.com/raymondyan-zhijie/Lei_MD"
Issues = "https://github.com/raymondyan-zhijie/Lei_MD/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 把 src/ 注册为可导入的包（与 [project] name=lei-md 区分：
# name 是 pip 包名（lei-md），src 是 Python 导入名（src.*））
packages = ["src", "src.ui", "src.core"]

[tool.setuptools.package-data]
# 资源文件（locale json、icon 等）随包分发
"src.resources" = ["*.qrc", "locales/*.json", "icons/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-v --tb=short"
markers = [
    "smoke: smoke tests for CI dependency update validation",
]
