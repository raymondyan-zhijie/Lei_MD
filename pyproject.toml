[project]
name = "lei-md"
version = "0.4.5"
description = "Windows GUI for Microsoft MarkItDown - convert files to Markdown with drag & drop, offline and all-in-one"
authors = [{name = "leimengde"}]
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "markitdown[all]>=0.1.0,<0.2.0",
    # v0.4.2 P2 fix：PySide6 6.11 + Python 3.12 触发 pytest-qt _process_events
    # 的 Fatal Python error: Aborted（QDragEnterEvent 路径 segfault）。
    # 之前测试在 6.9.x 全绿，6.10+ 引入该问题。临时收紧到 <6.11，等
    # 上游修再放开（issue: https://bugreports.qt.io/ PYSIDE-2845 类似）。
    "PySide6>=6.7,<6.11",
    "darkdetect>=0.8,<0.9",
    "markdown>=3.6,<4.0",
    "Pygments>=2.18,<3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0,<5.0",
    "ruff>=0.5,<0.10",
    "packaging>=24.0",  # for upstream version check
    'tomli>=2.0; python_version < "3.11"',  # tomllib backport for py3.10
]

[project.scripts]
lei-md = "src.main:main"

[project.urls]
Homepage = "https://github.com/raymondyan-zhijie/Lei_MD"
Repository = "https://github.com/raymondyan-zhijie/Lei_MD"
Issues = "https://github.com/raymondyan-zhijie/Lei_MD/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 把 src/ 注册为可导入的包（与 [project] name=lei-md 区分：
# name 是 pip 包名（lei-md），src 是 Python 导入名（src.*））
packages = ["src", "src.ui", "src.core"]

[tool.setuptools.package-data]
# 资源文件（locale json、icon 等）随包分发
"src.resources" = ["*.qrc", "locales/*.json", "icons/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Spec/scripts/docs aren't checked (PyInstaller spec is build-only,
# PowerShell + NSIS are not Python, Markdown doesn't lint here).
extend-exclude = [
    "Lei_MD.spec",
    "scripts",
    "installer",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests often have long parametrized signatures / inline assertions where
# splitting would hurt readability. Production code (src/) still gets full E501.
"tests/**" = ["E501"]
# src/ui/i18n.py docstring may carry Chinese explanations that overflow.
"src/ui/i18n.py" = ["E501"]
# src/ui/styles.py embeds a single CSS line for QProgressBar (multiline CSS
# would also work but the rest of the stylesheet is single-line for grep-ability).
"src/ui/styles.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-v --tb=short"
markers = [
    "smoke: smoke tests for CI dependency update validation",
]
